aid: zhihu
name: Zhihu
description: 'Zhihu (知乎) is a Chinese online question-and-answer and knowledge-sharing
  community, often described as China''s answer to Quora, where users post questions
  and answers, follow topics and creators, and consume long-form content, columns,
  live sessions, e-books and short video. Founded in 2011 and headquartered in Beijing,
  Zhihu operates one of China''s largest online content communities and is dual-listed
  (NYSE: ZH; HKEX: 2390). It was surfaced in the API Evangelist network as a portfolio
  company of Qiming Venture Partners. As of this enrichment pass Zhihu publishes no
  public developer platform, open API, SDKs, or machine-readable API artifacts on its
  primary domain; this profile therefore captures company identity plus a probed
  domain-security posture rather than an API surface.'
